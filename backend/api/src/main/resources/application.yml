server: # postgresSQL
  port: 5212

spring:
  application:
    name: api
  datasource: # db vars
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PW}
  jpa:
    hibernate:
      ddl-auto: validate #checks db schema
  flyway:
    enabled: true # checks for migrations and runs if new migration found
    baseline-on-migrate: true
