name: Build & Release

on:
  push:
    tags:
      - 'v*'  # run on push with version tag

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build JAR
        run: |
          chmod +x backend/api/gradlew
          cd backend/api
          ./gradlew bootJar

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            backend/api/build/libs/*.jar
            frontend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            backend/dlClass.API/publish
            frontend/dist

      - name: Create Release # Creates 
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/dlClass.API/publish/*
            frontend/dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}