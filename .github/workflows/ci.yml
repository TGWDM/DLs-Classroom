name: CI

# Configures test run criteria
on: 
    push:
        branches : [ main ]
    pull_request:
        branches: [ main ]

# Configure Test Jobs
jobs:
    # Backend CI
    backend:
        name: Backend .NET 10
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4 # downloads code so it can be accessed 
            
            - name: Setup .NET
              uses: actions/setup-dotnet@v4 # install dotnet sdk for testing
              with:
                dotnet-version: '10.0.x'
            
            - name: Restore dependencies
              run: dotnet restore ./backend/dlClass.API/dlClass.API.csproj
            
            - name: Build
              run:  dotnet build ./backend/dlClass.API/dlClass.API.csproj --no-restore --configuration Release
              
            - name: Run tests
              run: dotnet build ./backend/dlClass.API/dlClass.API.csproj --no-build --configuration Release  --verbosity normal
              continue-on-error: true # runs all test even if one errors
    
    # Frontend
    frontend:
        name: Frontend (React + Vite)
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses:  actions/checkout@v4
        
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: ./frontend/package-lock.json
        
        - name: Install dependencies
          run: npm ci
          working-directory: ./frontend

        - name: Build (Vite)
          run: npm run build
          working-directory: ./frontend

        - name: Run tests (if you have them)
          run: npm test -- --passWithNoTests
          working-directory: ./frontend
          continue-on-error: true
        
    # Electron Build
    electron:
        name: Electron (Desktop App)
        runs-on: ubuntu-latest
        needs: [frontend]
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: ./frontend/package-lock.json

        - name: Install dependencies
          run: npm ci
          working-directory: ./frontend

        - name: Build Electron app
          run: npm run build
          working-directory: ./frontend
          # Note: You'll need to add a build:electron script later

        - name: Upload Electron build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: electron-build
            path: ./frontend/dist/
            