name: CI

# Configures test run criteria
on: 
    push:
        branches : [ main ]
    pull_request:
        branches: [ main ]

# Configure Test Jobs
jobs:
    # Backend CI
    backend:
        name: Backend Java 25 + Springboot
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4 # downloads code so it can be accessed 
            
            - name: Setup Java
              uses: actions/setup-java@v4 # installs Java sdk for testing
              with:
                distribution: 'temurin'
                java-version: '25'
            
            - name: Grant execute permission for gradlew
              run: chmod +x backend/api/gradlew
            
            - name: Build & Test
              run: ./gradlew build --no-daemon
              working-directory: ./backend/api
    # Frontend
    frontend:
        name: Frontend (React + Vite)
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses:  actions/checkout@v4
        
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: ./frontend/package-lock.json
        
        - name: Install dependencies
          run: npm ci
          working-directory: ./frontend

        - name: Build (Vite)
          run: npm run build
          working-directory: ./frontend

        - name: Run tests
          run: npm run test:ci
          working-directory: ./frontend
        
    # Electron Build
    electron:
        name: Electron (Desktop App)
        runs-on: ubuntu-latest
        needs: [frontend]
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: ./frontend/package-lock.json

        - name: Install dependencies
          run: npm ci
          working-directory: ./frontend

        - name: Build Electron app
          run: npm run build
          working-directory: ./frontend
          # Note: You'll need to add a build:electron script later

        - name: Upload Electron build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: electron-build
            path: ./frontend/dist/
            